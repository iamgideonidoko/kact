[package]
name = "kact"
version = "0.0.1"
edition = "2024"
authors = ["Gideon Idoko"]
description = "Keyboard-driven cursor actuator"
license = "MIT"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
toml = "0.8"
clap = { version = "4.5", features = ["derive"] }
thiserror = "1.0"
anyhow = "1.0"
tracing = "0.1"
tracing-subscriber = "0.3"
notify = "6.1"
crossbeam-channel = "0.5"
serde_json = "1.0"
libc = "0.2"
signal-hook = "0.3"

[target.'cfg(target_os = "macos")'.dependencies]
core-graphics = { version = "0.23", features = ["highsierra"] }
cocoa = "0.26"
objc = "0.2"
core-foundation = "0.9"

[target.'cfg(target_os = "linux")'.dependencies]
x11 = { version = "2.21", features = ["xlib", "xtest", "xrecord"] }

# [dev-dependencies]
# approx = "0.5"
#
[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true

[features]
default = ["mac-dev-mode"]
mac-dev-mode = []
