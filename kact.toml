# Run `kact config init` to create your user configuration.
[motion]
# Acceleration curve: linear, sigmoid, or exponential.
curve_type = "sigmoid"
max_speed = 2000.0
acceleration = 0.8
# Fraction of velocity retained per 1/60 second after release.
friction = 0.95
target_fps = 144

[modes]
normal_multiplier = 1.0
precise_multiplier = 0.3
fast_multiplier = 2.5

[keybindings]
# No global shortcuts are installed by default.
enabled = false
# Keys are captured only during explicitly activated navigation.
navigation_enabled = true
preset = "vi"

[keybindings.global]
# "ctrl+alt+g" = "activate grid"

[keybindings.local]

[navigation]
rows = 12
columns = 20
alphabet = "asdfghjklqwertyuiopzxcvbnm"
auto_click = false

# Optional overrides inherit omitted fields from [navigation].
[navigation.grid]
# rows = 10
# columns = 16

[navigation.elements]
# auto_click = true

[appearance]
font_size = 14.0
foreground = "#FFFFFF"
background = "#17212B"
highlight = "#FFD166"
opacity = 0.85
grid_lines = true
# center | top | right | bottom | left | top-left | top-right | bottom-left | bottom-right
label_position = "center"

# Optional overrides inherit omitted fields from [appearance].
[appearance.grid]
# grid_lines = true

[appearance.elements]
# grid_lines = false
# label_position = "top-left"

[system]
hot_reload = true
log_level = "info"
