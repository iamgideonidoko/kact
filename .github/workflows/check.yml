name: Check
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  check:
    strategy:
      matrix:
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install X11 development libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libx11-dev libxtst-dev
      - name: Install Rust
        run: rustup toolchain install 1.88.0 --profile minimal --component rustfmt --component clippy && rustup default 1.88.0
      - run: cargo fmt --check
      - run: cargo test --locked
      - run: cargo clippy --locked --all-targets --all-features -- -D warnings
      - run: cargo build --locked --release
  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install X11 development libraries
        run: sudo apt-get update && sudo apt-get install -y libx11-dev libxtst-dev
      - name: Install Rust
        run: rustup toolchain install 1.88.0 --profile minimal --component llvm-tools-preview && rustup default 1.88.0
      - uses: taiki-e/install-action@d163c8a87a9ec7b9fc90aafe588cf5a89c736cf4 # cargo-llvm-cov
      - name: Measure core coverage
        run: |
          cargo llvm-cov --locked --all-targets --json --summary-only --output-path target/coverage.json
          python3 scripts/check_core_coverage.py target/coverage.json
      - name: Create HTML report
        run: cargo llvm-cov report --html --output-dir target/coverage/html
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: coverage-html
          path: target/coverage
