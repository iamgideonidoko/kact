name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - env:
          TAG: ${{ github.ref_name }}
        run: |
          version=$(awk '/^\[package\]$/ { in_package = 1; next } in_package && /^\[/ { exit } in_package && /^version = / { gsub(/"/, "", $3); print $3; exit }' Cargo.toml)
          test "$TAG" = "v$version"
          scripts/release-notes.sh "$version" > RELEASE_NOTES.md
  verify:
    needs: prepare
    strategy:
      matrix:
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libx11-dev libxtst-dev
      - run: rustup toolchain install 1.88.0 --profile minimal --component rustfmt --component clippy && rustup default 1.88.0
      - run: cargo fmt --check
      - run: cargo test --locked
      - run: cargo clippy --locked --all-targets --all-features -- -D warnings
      - run: cargo build --locked --release
  coverage:
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: sudo apt-get update && sudo apt-get install -y libx11-dev libxtst-dev
      - run: rustup toolchain install 1.88.0 --profile minimal --component llvm-tools-preview && rustup default 1.88.0
      - uses: taiki-e/install-action@d163c8a87a9ec7b9fc90aafe588cf5a89c736cf4 # cargo-llvm-cov
      - run: cargo llvm-cov --locked --all-targets --json --summary-only --output-path target/coverage.json
      - run: python3 scripts/check_core_coverage.py target/coverage.json
  docs:
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: docs/pnpm-lock.yaml
      - run: pnpm --dir docs install --frozen-lockfile
      - run: pnpm --dir docs run build
  package:
    needs: [prepare, verify, coverage, docs]
    strategy:
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: macos-latest
            target: x86_64-apple-darwin
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libx11-dev libxtst-dev
      - run: rustup toolchain install 1.88.0 --profile minimal && rustup default 1.88.0
      - run: rustup target add ${{ matrix.target }}
      - run: scripts/package-release.sh --target ${{ matrix.target }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: kact-${{ matrix.target }}
          path: dist/
          if-no-files-found: error
  publish:
    needs: [prepare, package]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Create release notes
        run: |
          version=$(awk '/^\[package\]$/ { in_package = 1; next } in_package && /^\[/ { exit } in_package && /^version = / { gsub(/"/, "", $3); print $3; exit }' Cargo.toml)
          scripts/release-notes.sh "$version" > RELEASE_NOTES.md
      - run: cat artifacts/*.sha256 | sort > SHA256SUMS
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          args=()
          [[ "$TAG" == *-* ]] && args+=(--prerelease)
          gh release create "$TAG" artifacts/*.tar.gz SHA256SUMS "${args[@]}" \
            --title "$TAG" --notes-file RELEASE_NOTES.md
